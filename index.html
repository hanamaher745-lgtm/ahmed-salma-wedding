<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#540e22"><title>Ahmed & Salma | Wedding Invitation</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#320c19;color:#4c1824;font-family:Georgia,serif}.invitation{max-width:540px;margin:auto;background:#f9ebd7;box-shadow:0 0 60px #17030c}.page{position:relative;line-height:0}.page img{width:100%;height:auto;display:block}.timer{position:absolute;top:63.2%;left:17%;width:66%;height:5.2%;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;text-align:center;line-height:1;background:linear-gradient(90deg,#f9ead5,#f9ead5);color:#4d1924;font-family:Georgia,serif;font-size:clamp(14px,4.4vw,25px);font-variant-numeric:tabular-nums}.timer span{display:block}.map-hit{position:absolute;left:10%;top:74%;width:80%;height:22%;cursor:pointer}.map-button{position:absolute;left:24%;bottom:3.1%;width:52%;border:1px solid #7b5b43;border-radius:20px;background:#fff4e4e8;padding:11px 5px;color:#4d1924;text-align:center;text-decoration:none;font:14px Georgia,serif;line-height:1.2}.map-button:focus,.map-hit:focus{outline:3px solid #d3a64b;outline-offset:2px}@media(min-width:540px){.timer{font-size:24px}}@media(max-width:400px){.map-button{font-size:12px;padding:8px 3px}}</style></head><body><main class="invitation"><section class="page"><img src="page1.jpg" alt="Wedding invitation envelope"></section><section class="page"><img src="page2.jpg" alt="Salma and Ahmed — November 27, 2026"></section><section class="page"><img src="page3.jpg" alt="Wedding countdown"><div class="timer" role="timer" aria-label="Time remaining until November 27 2026 at 7 PM Cairo time"><span id="days">--</span><span id="hours">--</span><span id="minutes">--</span><span id="seconds">--</span></div></section><section class="page"><img src="page4.jpg" alt="Save the date November 27, 2026"></section><section class="page"><img src="page5.jpg" alt="The celebration begins at 7 PM"></section><section class="page"><img src="page6.jpg" alt="Join us at Volare, Tagamoa"><a class="map-hit" href="https://maps.app.goo.gl/6b3BnmGwQUt3JVhy7?g_st=ic" target="_blank" rel="noopener" aria-label="Open Volare Tagamoa in Google Maps"></a><a class="map-button" href="https://maps.app.goo.gl/6b3BnmGwQUt3JVhy7?g_st=ic" target="_blank" rel="noopener">📍 Open Location</a></section></main><script>const date=new Date('2026-11-27T19:00:00+02:00');function tick(){let t=Math.max(0,Math.floor((date-Date.now())/1000));let vals=[Math.floor(t/86400),Math.floor(t%86400/3600),Math.floor(t%3600/60),t%60];['days','hours','minutes','seconds'].forEach((id,i)=>document.getElementById(id).textContent=String(vals[i]).padStart(2,'0'))}tick();setInterval(tick,1000)</script></body></html>
