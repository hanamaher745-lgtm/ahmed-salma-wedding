<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ahmed & Salma | Wedding Invitation</title><meta name="theme-color" content="#3d0d1e"><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#310b1a;color:#4c1824;font-family:Georgia,serif}.invitation{max-width:540px;margin:auto;background:#f9ebd7;box-shadow:0 0 50px #17030c}.page{position:relative;line-height:0}.page img{width:100%;height:auto;display:block}.timer{position:absolute;top:63.2%;left:17%;width:66%;height:5.2%;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;text-align:center;line-height:1;background:#f9ead5;color:#4d1924;font:clamp(14px,4.4vw,25px) Georgia,serif;font-variant-numeric:tabular-nums}.timer span{display:block}.map-hit{position:absolute;left:24%;top:88%;width:52%;height:6%;cursor:pointer}.map-button{position:absolute;left:24%;bottom:3.1%;width:52%;border:1px solid #7b5b43;border-radius:20px;background:#fff4e4ed;padding:11px 5px;color:#4d1924;text-align:center;text-decoration:none;font:14px Georgia,serif;line-height:1.2}.sound{position:fixed;z-index:30;right:12px;bottom:12px;border:1px solid #d8bba1;border-radius:25px;background:#50182c;color:white;padding:12px 16px;font-size:14px;cursor:pointer}.intro{position:fixed;inset:0;z-index:50;background:#210813;display:flex;align-items:center;justify-content:center;flex-direction:column}.intro video{max-width:100%;max-height:100%;height:100%;object-fit:contain}.intro .start{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);border:1px solid #d9bba0;background:#50182ce8;color:#fff;border-radius:30px;padding:14px 24px;white-space:nowrap;font:16px Georgia,serif;cursor:pointer}.intro .skip{position:absolute;right:15px;top:15px;border:0;background:#fff9;color:#421020;border-radius:25px;padding:9px 14px;cursor:pointer}.intro.hidden{display:none}body.intro-open{overflow:hidden}@media(min-width:540px){.timer{font-size:24px}}@media(max-width:400px){.map-button{font-size:12px;padding:8px 3px}}</style></head><body class="intro-open"><div class="intro" id="intro"><video id="opening" src="opening.mp4" playsinline preload="metadata" poster="page1.jpg"></video><button class="skip" id="skip">Skip intro →</button><button class="start" id="start">💌 Open invitation · Play music</button></div><audio id="music" src="music.mp3" loop preload="none"></audio><button class="sound" id="sound" aria-label="Toggle music">♫ Music: Off</button><main class="invitation"><section class="page"><img src="page2.jpg" alt="Salma and Ahmed — November 27, 2026" loading="lazy"></section><section class="page"><img src="page3.jpg" alt="Wedding countdown" loading="lazy"><div class="timer" role="timer" aria-label="Time remaining until November 27 2026 at 7 PM Cairo time"><span id="days">--</span><span id="hours">--</span><span id="minutes">--</span><span id="seconds">--</span></div></section><section class="page"><img src="page4.jpg" alt="Save the date November 27, 2026" loading="lazy"></section><section class="page"><img src="page5.jpg" alt="The celebration begins at 7 PM" loading="lazy"></section><section class="page"><img src="page6.jpg" alt="Join us at Volare, Tagamoa" loading="lazy"<a class="map-hit" href="https://maps.app.goo.gl/6b3BnmGwQUt3JVhy7?g_st=ic" target="_blank" rel="noopener" aria-label="Open Location"></a></section></main><script>const date=new Date('2026-11-27T19:00:00+02:00');function tick(){let t=Math.max(0,Math.floor((date-Date.now())/1000));let vals=[Math.floor(t/86400),Math.floor(t%86400/3600),Math.floor(t%3600/60),t%60];['days','hours','minutes','seconds'].forEach((id,i)=>document.getElementById(id).textContent=String(vals[i]).padStart(2,'0'))}tick();setInterval(tick,1000);const intro=document.getElementById('intro'),v=document.getElementById('opening'),m=document.getElementById('music'),sound=document.getElementById('sound');function update(){sound.textContent=m.paused?'♫ Music: Off':'♫ Music: On'}function closeIntro(){intro.classList.add('hidden');document.body.classList.remove('intro-open');v.pause();window.scrollTo(0,0)}document.getElementById('start').onclick=()=>{m.play().catch(()=>{});update();document.getElementById('start').hidden=true;v.play().catch(closeIntro)};document.getElementById('skip').onclick=closeIntro;v.onended=closeIntro;sound.onclick=()=>{if(m.paused)m.play().catch(()=>{});else m.pause();update()};m.onplay=update;m.onpause=update;</script></body></html>
